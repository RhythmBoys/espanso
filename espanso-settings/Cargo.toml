[package]
name = "espanso-settings"
version = "0.1.0"
authors = ["Federico Terzi <federicoterzi96@gmail.com>"]
edition = "2021"
license = "GPL-3.0"

[features]
default = ["ui"]
ui = ["dep:rfd", "dep:slint"]

[dependencies]
anyhow.workspace = true
atomicwrites = "0.4.4"
dunce = "1.0.1"
espanso-config = { path = "../espanso-config" }
espanso-ipc = { path = "../espanso-ipc" }
fs_extra.workspace = true
fs2 = "0.4.3"
opener = "0.5.0"
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"], optional = true }
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
slint = { version = "=1.17.1", default-features = false, features = [
  "accessibility",
  "backend-winit",
  "compat-1-2",
  "renderer-femtovg",
  "std",
], optional = true }
thiserror.workspace = true
walkdir.workspace = true
zip = { version = "0.5.13", default-features = false, features = ["deflate"] }

[build-dependencies]
slint-build = "=1.17.1"

[dev-dependencies]
tempdir.workspace = true

[lints]
workspace = true
